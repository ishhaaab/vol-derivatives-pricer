# GitHub Actions CI for vol-derivatives-pricer.
#
# Runs pytest + pyright on a small Python x OS matrix.  The examples/
# directory is NOT exercised here -- those scripts need network
# access (yfinance fetch) and are run-on-demand locally, not in CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR/branch when a new push
# lands; saves free minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + pyright
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pyright

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Run pyright on src/
        run: pyright src/
